<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%;background:var(--color-canvas);color:var(--color-text-primary);font-family:var(--font-sans);-webkit-font-smoothing:antialiased}
a{color:var(--color-primary);text-decoration:none}a:hover{color:var(--color-primary-hover);text-decoration:underline}
button{font-family:var(--font-sans)}
::selection{background:var(--color-primary-soft)}
:where(a,button,input,textarea,[tabindex]):focus-visible{outline:2px solid var(--color-primary);outline-offset:2px}
.scroll-quiet{scrollbar-width:thin;scrollbar-color:transparent transparent}
.scroll-quiet:hover{scrollbar-color:var(--color-border) transparent}
.scroll-quiet::-webkit-scrollbar{width:8px}
.scroll-quiet::-webkit-scrollbar-thumb{background:transparent;border-radius:8px}
.scroll-quiet:hover::-webkit-scrollbar-thumb{background:var(--color-border)}
.hover-tint-subtle:hover{background:var(--color-surface-2)}
.shimmer{background:linear-gradient(90deg,var(--color-surface-2) 25%,var(--color-border) 37%,var(--color-surface-2) 63%);background-size:200% 100%}
.rise,.swap-in{opacity:1;transform:none}
@media (prefers-reduced-motion:no-preference){
@keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}
.shimmer{animation:shimmer 1.4s ease infinite}
@keyframes riseIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.rise{animation:riseIn .25s var(--ease-standard) both}
@keyframes pulseDot{0%,100%{opacity:1}50%{opacity:.35}}
.pulse-dot{animation:pulseDot 1s ease infinite}
@keyframes swapIn{from{opacity:0;transform:translateY(2px)}to{opacity:1;transform:none}}
.swap-in{animation:swapIn var(--duration-normal) var(--ease-standard) both}
}
</style>
</head>
