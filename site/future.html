    previewId: 1,

    const mDollar = Number(this.props.materialityDollar ?? 150);   // $000s

    const moved = this.state.accrualMovedToQ3;
    const a = {
      product: 6240, services: 1940, cogs: 2760 + (reclass ? 120 : 0), rnd: 1440 - (reclass ? 120 : 0),
      sm: moved ? 1830 : 2010, ga: 1005, intInc: 45, intExp: -60, otherNet: 12
    };
    const b = { product: 6100, services: 2200, cogs: 2660, rnd: 1560, sm: 1820, ga: 1060, intInc: 40, intExp: -60, otherNet: 0 };
    const d = (o) => {
      o.totalRev = o.product + o.services;
      o.gross = o.totalRev - o.cogs;
      o.opex = o.rnd + o.sm + o.ga;
      o.oi = o.gross - o.opex;
      o.totalOther = o.intInc + o.intExp + o.otherNet;
      o.pretax = o.oi + o.totalOther;
      o.tax = Math.round(o.pretax * 0.25);
      o.net = o.pretax - o.tax;
